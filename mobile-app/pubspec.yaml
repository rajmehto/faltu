name: tango_live
description: A complete Tango Live-style live streaming app with advanced features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.3
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4
  firebase_storage: ^11.5.5
  cloud_firestore: ^4.13.4
  firebase_remote_config: ^4.3.7
  firebase_crashlytics: ^3.4.7
  firebase_performance: ^0.9.3+7

  # Authentication
  google_sign_in: ^6.1.6
  flutter_facebook_auth: ^6.0.4
  sign_in_with_apple: ^5.0.0

  # Streaming
  agora_rtc_engine: ^6.3.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Payments
  stripe_flutter: ^9.5.0
  razorpay_flutter: ^1.3.6
  in_app_purchase: ^3.1.13

  # Camera & Media
  camera: ^0.10.5+9
  image_picker: ^1.0.4
  video_player: ^2.8.1
  photo_view: ^0.14.0
  image_cropper: ^5.0.0
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0

  # UI Components
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  flutter_spinkit: ^5.2.0
  badges: ^3.1.2
  pinput: ^3.0.1
  flutter_rating_bar: ^4.0.1
  step_progress_indicator: ^1.0.2
  percent_indicator: ^4.2.3
  animated_text_kit: ^4.2.2
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^23.2.7
  table_calendar: ^3.0.9
  intl: ^0.18.1

  # Filters & Effects
  camera_filters: ^1.0.3
  image: ^4.1.3
  tflite_flutter: ^0.10.4

  # Navigation
  go_router: ^12.1.3

  # Notifications
  flutter_local_notifications: ^16.2.0
  awesome_notifications: ^0.8.3

  # Permissions
  permission_handler: ^11.1.0

  # Maps & Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

  # Social Sharing
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  flutter_sound: ^9.2.13

  # Video
  video_thumbnail: ^0.5.3
  ffmpeg_kit_flutter: ^6.0.3

  # Utilities
  uuid: ^4.2.2
  crypto: ^3.0.3
  convert: ^3.1.1
  path_provider: ^2.1.1
  path: ^1.8.3
  mime: ^1.0.4
  file_picker: ^6.1.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  battery_plus: ^4.0.2
  sensors_plus: ^4.0.2
  vibration: ^1.8.4
  wakelock_plus: ^1.1.4
  app_links: ^4.0.2

  # Analytics & Monitoring
  sentry_flutter: ^7.14.0
  datadog_flutter_plugin: ^2.2.1

  # Internationalisation
  flutter_localizations:
    sdk: flutter

  # AR & Filters
  arkit_plugin: ^1.0.9

  # Social Media
  any_link_preview: ^3.0.0-beta.1

  # Charts
  d_chart: ^0.9.1

  cupertino_icons: ^1.0.6
  flutter_vector_icons: ^2.0.0
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.8
  expandable: ^5.0.1
  visibility_detector: ^0.4.0+2
  scrollable_positioned_list: ^0.3.8
  flutter_slidable: ^3.0.1
  swipeable_tile: ^1.0.3
  bottom_sheet: ^3.0.2
  modal_bottom_sheet: ^3.0.0
  flutter_colorpicker: ^1.0.3
  skeletonizer: ^1.0.1
  flutter_animate: ^4.3.0
  rive: ^0.12.4
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.3
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/

